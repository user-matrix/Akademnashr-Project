<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1030" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Block Nova — a colourful block puzzle with combos, bombs, gems and fever mode." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Block Nova</title>
  </head>
  <body>
    <div id="app">
      <header id="hud" hidden>
        <button id="btn-pause" class="icon-btn" aria-label="Pause"></button>
        <div class="score-box">
          <div id="score">0</div>
          <div id="best" class="best"></div>
        </div>
        <div id="coins" class="coin-pill"></div>
      </header>
      <div id="subhud" hidden>
        <div id="chip" class="chip" hidden></div>
        <div id="daily-bar" class="daily-bar" hidden>
          <div class="fill"></div>
          <span class="label"></span>
        </div>
      </div>
      <main id="stage">
        <canvas id="board" aria-label="Game board"></canvas>
        <div id="hint" class="hint" hidden></div>
        <div id="toast" class="toast" hidden></div>
      </main>
      <footer id="boosters" hidden></footer>
      <button id="give-up" class="give-up" hidden></button>
    </div>
    <div id="home" class="screen" hidden></div>
    <div id="layer"></div>
    <noscript>Please enable JavaScript to play.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
