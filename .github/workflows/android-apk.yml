# Builds an installable Android APK of Block Nova on every push that touches the game.
# Download it from the run page → "Artifacts" → block-nova-apk, unzip, and install on an Android phone
# (allow "Install unknown apps" for your browser or file manager when asked).
name: Android APK

on:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'game/**'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web bundle (typecheck + Vite)
        run: npm run build

      - name: Copy web bundle into the Android project
        run: |
          npx cap sync android
          npm run native:config

      # Capacitor 8 compiles with Java 21. The Android SDK is preinstalled on GitHub's Ubuntu runners
      # (ANDROID_HOME); Gradle downloads any missing platform/build-tools itself.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Show Android SDK location
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Assemble debug APK
        working-directory: game/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK after the commit
        id: apk
        run: |
          SHORT=$(git rev-parse --short HEAD)
          VERSION=$(node -p "require('./package.json').version")
          NAME="block-nova-${VERSION}-${SHORT}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -la "$NAME"

      - uses: actions/upload-artifact@v5
        with:
          name: block-nova-apk
          path: game/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30
